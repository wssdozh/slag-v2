# Artifacts only. Never signs with the release key or publishes a release.
name: note registry staging
on:
  push:
    branches: [feat/note-replica]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: note-registry-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/feat/note-replica'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: npm run check && npm run test:scripts
      - name: Android SDK
        shell: bash
        run: |
          set -eu
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$manager" --licenses >/dev/null) || true
          "$manager" --install 'ndk;27.0.12077973' 'platforms;android-37.0' 'build-tools;37.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Isolate staging app on the device
        run: |
          app=src-tauri/gen/android/app
          # Keep the Kotlin namespace for JNI, but use a separate package/UID/data directory.
          sed -i 's/applicationId = "com.slag.notes"/applicationId = "com.slag.notes.staging.r${{ github.run_id }}"/' "$app/build.gradle.kts"
          sed -i 's/"SLAG"/"SLAG staging"/g' "$app/src/main/res/values/strings.xml"
          sed -i -e 's/<application$/<application android:allowBackup="false"/' -e 's/android:scheme="slag"/android:scheme="slag-staging"/' "$app/src/main/AndroidManifest.xml"
          sed -i '/^[[:space:]]*updater::update_/d; /^[[:space:]]*if let Some((target, pid)) = updater::is_apply_update_args(&args) {/,+3d' src-tauri/src/lib.rs
          sed -i "s|export const DEFAULT_SYNC_SERVER_URL = .*|export const DEFAULT_SYNC_SERVER_URL = 'http://127.0.0.1:18320';|" src/config/sync.ts
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src-tauri/tauri.conf.json';
          const conf = JSON.parse(readFileSync(path, 'utf8'));
          for (const key of ['csp', 'devCsp']) {
            conf.app.security[key] = conf.app.security[key].replace(/connect-src [^;]+/, "connect-src 'self' ipc: http://ipc.localhost http://127.0.0.1:18320 ws://127.0.0.1:18320");
          }
          writeFileSync(path, JSON.stringify(conf));
          JS
      - name: Build and verify staging APK
        run: |
          npx tauri android build --ci --debug --apk --target aarch64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' -print -quit)
          test -n "$apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.slag.notes.staging.r${{ github.run_id }}' "
          "$tools/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/SLAG-staging.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: slag-staging-android
          path: ${{ runner.temp }}/SLAG-staging.apk
          if-no-files-found: error
          retention-days: 7

  desktop:
    if: github.ref == 'refs/heads/feat/note-replica'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: slag-v2.exe
          - os: ubuntu-22.04
            platform: linux
            binary: slag-v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Isolate desktop staging identity
        shell: bash
        run: |
          set -eu
          id='com.slag.notes.staging.r${{ github.run_id }}'
          sed -i "s/\"com.slag.notes\"/\"$id\"/g" src-tauri/src/{secure_store,lib,platform}.rs
          sed -i "s/com\.slag\.notes\./$id./g; s/=com\.slag\.notes$/=$id/" src-tauri/src/platform.rs
          sed -i '/^[[:space:]]*platform::auto_adapt_system();/d; /^[[:space:]]*updater::cleanup_leftovers();/d; /^[[:space:]]*deeplink::register_scheme();/d; /^[[:space:]]*if let Err(err) = app.global_shortcut().register(hotkey) {/,+2d; /^[[:space:]]*let hotkey = Shortcut::new(/,+3d' src-tauri/src/lib.rs
          sed -i '/^[[:space:]]*updater::update_/d; /^[[:space:]]*if let Some((target, pid)) = updater::is_apply_update_args(&args) {/,+3d' src-tauri/src/lib.rs
          sed -i "s|export const DEFAULT_SYNC_SERVER_URL = .*|export const DEFAULT_SYNC_SERVER_URL = 'http://127.0.0.1:18320';|" src/config/sync.ts
          STAGING_ID="$id" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src-tauri/tauri.conf.json';
          const conf = JSON.parse(readFileSync(path, 'utf8'));
          conf.identifier = process.env.STAGING_ID;
          conf.productName = 'SLAG staging';
          for (const win of conf.app.windows) win.title = 'SLAG staging';
          for (const key of ['csp', 'devCsp']) {
            conf.app.security[key] = conf.app.security[key].replace(/connect-src [^;]+/, "connect-src 'self' ipc: http://ipc.localhost http://127.0.0.1:18320 ws://127.0.0.1:18320");
          }
          writeFileSync(path, JSON.stringify(conf));
          JS
      - run: pnpm exec tauri build --ci --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: slag-staging-${{ matrix.platform }}
          path: src-tauri/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
