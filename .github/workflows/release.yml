# Builds and publishes SLAG.
#
#   push to master        → dev build: 0.2.6-dev.<run>, published as a prerelease on the `dev` tag
#   tag v1.2.3            → stable: becomes GitHub's `latest`, which is what a release client reads
#   tag v1.2.3-beta.4     → beta: its own release plus a rewritten `latest.json` on the `beta` tag
#
# The rules themselves live in scripts/release-meta.mjs and are covered by node --test, so this
# workflow only wires them to the build. A stable client can never see a prerelease: GitHub's
# `latest` skips prereleases, and the beta/dev manifests live on their own rolling tags.
name: release

on:
  push:
    tags:
      - 'v*'
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: 'канал предварительной сборки (стабильный релиз выпускается тегом v1.2.3)'
        type: choice
        options: [dev, beta]
        default: dev
      notes:
        description: 'что поменялось (пусто — соберём из коммитов)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      manifest_tag: ${{ steps.meta.outputs.manifest_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: версия, канал и тег
        id: meta
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          ASKED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./src-tauri/tauri.conf.json').version")
          notes="${NOTES:-}"
          if [ -z "$notes" ]; then
            previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            notes=$(git log --pretty='- %s' ${previous:+$previous..HEAD} -n 40)
          fi
          meta=$(node scripts/release-meta.mjs --ref "$GITHUB_REF" --base "$base" \
            --run "$GITHUB_RUN_NUMBER" --channel "${ASKED_CHANNEL:-}" --notes "$notes")
          echo "$meta"
          echo "$meta" | node -e '
            const meta = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const out = {
              version: meta.version,
              channel: meta.channel,
              tag: meta.tag,
              prerelease: String(meta.prerelease),
              manifest_tag: meta.manifestTag ?? "",
            };
            for (const [key, value] of Object.entries(out)) console.log(`${key}=${value}`);
          ' >> "$GITHUB_OUTPUT"
          echo "$meta" | node -e '
            process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).notes + "\n");
          ' > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      # The channel rules decide who gets what; a green pipeline on broken rules is worse than red.
      - run: node --test scripts/release-meta.test.mjs

  # Two jobs instead of one matrix: each platform has its own runner and its own bundle set, and a
  # job-level `if` cannot read `matrix` (only `steps.*` can). Both run on every channel — a linux
  # build costs no wall-clock time next to windows, and a dev build without AppImage/deb/pkg means
  # every linux machine builds from source by hand.
  desktop-windows:
    needs: [prepare, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: версия сборки
        shell: bash
        run: printf '{"version":"%s"}' '${{ needs.prepare.outputs.version }}' > "$RUNNER_TEMP/version.json"
      - name: build
        shell: bash
        run: npx tauri build --config "$RUNNER_TEMP/version.json" --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/slag-v2*
            src-tauri/target/release/bundle/**

  desktop-linux:
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: linux libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: версия сборки
        run: printf '{"version":"%s"}' '${{ needs.prepare.outputs.version }}' > "$RUNNER_TEMP/version.json"
      - name: build
        run: npx tauri build --config "$RUNNER_TEMP/version.json" --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/slag-v2*
            src-tauri/target/release/bundle/**

  android:
    needs: [prepare, verify]
    # A missing keystore must not swallow the whole release: the desktop build is still worth
    # publishing, and the manifest simply has no android entry that time.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ndk
        shell: bash
        run: |
          # A truncated download killed the whole apk once ("Archive is not a ZIP archive"), and a
          # preinstalled NDK is fine too: take whatever ends up under $ANDROID_HOME/ndk. No `set -e`
          # here — `yes |` dies of SIGPIPE the moment sdkmanager exits, which is not a failure.
          set -uo pipefail
          sdk="$ANDROID_HOME"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          ( yes | "$sdkmanager" --licenses > /dev/null ) || true
          pick_ndk() { ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -n 1; }
          ndk="$(pick_ndk)"
          for attempt in 1 2 3; do
            if [ -n "$ndk" ] && [ -d "$ndk" ]; then break; fi
            ( yes | "$sdkmanager" --install "ndk;27.0.12077973" ) || echo "ndk attempt $attempt failed"
            sleep 10
            ndk="$(pick_ndk)"
          done
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::NDK не установился: $sdk/ndk пуст"
            exit 1
          fi
          echo "using NDK $ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: версия сборки
        run: printf '{"version":"%s"}' '${{ needs.prepare.outputs.version }}' > "$RUNNER_TEMP/version.json"
      - name: build apk
        run: npx tauri android build --apk --target aarch64 --config "$RUNNER_TEMP/version.json"
      - name: sign apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/SLAG-${{ needs.prepare.outputs.version }}.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
            "$RUNNER_TEMP/SLAG-${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: ${{ runner.temp }}/SLAG-*.apk

  arch:
    needs: [prepare, verify, desktop-linux]
    if: needs.desktop-linux.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: .artifacts/desktop-linux
      - name: .pkg.tar.zst
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x scripts/pack-arch.sh
          mkdir -p arch-out
          # makepkg needs a real Arch userspace; deb is only repackaged, no Rust rebuild here.
          docker run --rm -e VERSION -v "$PWD/.artifacts:/artifacts:ro" -v "$PWD/arch-out:/out" \
            -v "$PWD/scripts:/scripts:ro" archlinux:latest bash -lc '
              pacman -Syu --noconfirm --needed base-devel sudo libarchive >/dev/null
              /scripts/pack-arch.sh /artifacts/desktop-linux/bundle "$VERSION" /out
            '
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-arch
          if-no-files-found: error
          path: arch-out/*.pkg.tar.zst

  publish:
    needs: [prepare, desktop-windows, desktop-linux, android, arch]
    # android and arch are optional: a build goes out when the desktop job succeeded.
    if: always() && needs.prepare.result == 'success' && needs.desktop-windows.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `tauri signer` is the repo's own dependency: without it npx has nothing to run.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: что публикуем
        shell: bash
        run: |
          set -euo pipefail
          find .artifacts -type f | sort
          mkdir -p out
          cp .artifacts/release-notes/notes.md out/notes.md
          cp .artifacts/desktop-windows/slag-v2.exe out/ 2>/dev/null || true
          cp .artifacts/desktop-windows/bundle/nsis/*setup.exe out/ 2>/dev/null || true
          cp .artifacts/android-apk/*.apk out/ 2>/dev/null || true
          cp .artifacts/desktop-linux/bundle/deb/*.deb out/ 2>/dev/null || true
          cp .artifacts/desktop-linux/bundle/appimage/*.AppImage out/ 2>/dev/null || true
          cp .artifacts/desktop-arch/*.pkg.tar.zst out/ 2>/dev/null || true
          ls -la out
      - name: sign and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/release.mjs \
            --version '${{ needs.prepare.outputs.version }}' \
            --channel '${{ needs.prepare.outputs.channel }}' \
            --repo '${{ github.repository }}' \
            --notes-file out/notes.md \
            $(find out -maxdepth 1 -type f ! -name 'notes.md' ! -name '*.sig' | sort)
