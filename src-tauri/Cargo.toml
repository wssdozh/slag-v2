[package]
name = "slag-v2"
version = "0.1.0"
description = "SLAG v2 — Ultra-minimalist notes system"
authors = ["SLAG"]
edition = "2021"

[lib]
name = "slag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# Android content:// file access (SAF trees, pickers, thumbnails). Pinned: its major tracks
# tauri's major, and a minor drift silently changes the ACL against capabilities/default.json.
tauri-plugin-android-fs = "=30.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"

# Release build: LTO and a single codegen unit for the fastest Android/desktop binary.
# `strip = "debuginfo"` drops DWARF but keeps symbols, so desktop release backtraces
# stay readable. `panic = "abort"` is deliberately omitted: Tauri uses catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
opt-level = 3
